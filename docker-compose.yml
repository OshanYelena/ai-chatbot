services:
  api:
    build: .
    container_name: ai_chatbot_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: ai_chatbot_db
    environment:
      POSTGRES_DB: simple_chatbot
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_password
    ports:
      - "5432:5432"
    volumes:
      - chatbot_postgres_data:/var/lib/postgresql/data

volumes:
  chatbot_postgres_data: